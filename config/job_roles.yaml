# ============================================================
# JobRadar Germany — Job Role Configuration
# Day 11: CrewAI Project
#
# Purpose:
# Define job titles relevant to the user's professional profile.
#
# Theory:
# Configuration separates search preferences from Python code.
# CrewAI agents will use these job-role groups to guide searches.
#
# Priority A = Strongest matches
# Priority B = Related opportunities
# Priority C = Transferable or growth opportunities
#
# Each entry contains a main title and alternative search terms.
# ============================================================

